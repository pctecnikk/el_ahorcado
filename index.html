<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@400;700;900&family=JetBrains+Mono:wght@700;800&display=swap">
<style>
/* Layout: one column — big title, player card, theme tiles or the game, ranking.
   Palette: deep navy night sky, turquoise sea and sunny yellow as accents (a trip around the world). */
:root{
  --bg:#0a1a3d; --panel:#122a5e; --tile:#1a3672; --ink:#f6f2e8; --muted:#b0c3e8;
  --red:#2f80ff; --gold:#ffd23f; --good:#4cc38a; --bad:#ff6b6b; --line:rgba(170,200,255,.22);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(180deg,rgba(47,128,255,.28),transparent 220px);background-repeat:no-repeat}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
.home{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;min-height:40px;box-sizing:border-box;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:800 15px/1 var(--body);text-decoration:none;transition:border-color .15s,color .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.home:hover,.home:focus-visible{border-color:var(--gold);color:var(--gold)}
.home:active{transform:scale(.96)}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.5vw,56px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 .tiles{display:inline-flex;gap:.08em}
h1 .t{display:inline-grid;place-items:center;width:.95em;height:1.1em;border-radius:.14em;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.8em}
h1 .t.r{background:var(--red);color:#fff}
h1 .t.y{background:var(--gold);color:#3a2600}
h1 .t.b{background:var(--bg);color:var(--gold);box-shadow:inset 0 0 0 .07em var(--gold)}
.sub{font-family:var(--display);font-weight:800;color:var(--gold);font-size:clamp(16px,4.4vw,24px);letter-spacing:.02em}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;color:var(--gold)}
.note{font-size:14px;color:var(--muted);line-height:1.5;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:900;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;background:var(--gold);color:#3a2600;touch-action:manipulation}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-weight:700;padding:9px 16px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;padding:4px}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nrow{display:flex;gap:8px}
.nrow input{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.code{font-family:var(--mono);font-size:19px;letter-spacing:.06em;color:var(--gold);user-select:all;-webkit-user-select:all}
.msg{color:var(--gold);font-weight:700}
details summary{cursor:pointer;font-weight:700;color:var(--gold)}
details[open] summary{margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* themes */
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.theme{font:inherit;color:var(--ink);text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .1s}
.theme:hover{border-color:var(--gold)}
.theme:active{transform:scale(.98)}
.theme .ico{font-size:30px;line-height:1}
.theme b{font-size:18px}
.theme span{color:var(--muted);font-size:13px}
.theme .lvtag{color:var(--gold);font-weight:800}
.theme.wide{grid-column:1/-1;border-color:var(--red);background:linear-gradient(90deg,rgba(47,128,255,.42),rgba(255,210,63,.1)),var(--panel)}
/* game */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
.backbtn{font:inherit;font-weight:900;font-size:16px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;min-height:44px}
.strip{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.strip b{color:var(--gold)}
.lv{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.lvlabel{font-weight:900;min-width:7.5em;text-align:center}
.lvlabel b{color:var(--gold);font-size:20px}
/* the gallows */
.stage{background:var(--panel);border-radius:14px;padding:6px;display:flex;justify-content:center;position:relative}
.gallows{width:100%;max-width:300px;height:auto;max-height:min(23vh,23svh);display:block}
.gallows .wood{stroke:#c9a46a;stroke-width:7;stroke-linecap:round;fill:none}
.gallows .rope{stroke:#e9d9b4;stroke-width:3;stroke-linecap:round;fill:none}
.gallows .man{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.gallows .ghost{stroke:var(--line);opacity:.35}
.gallows .pt{opacity:0;transition:opacity .25s}
.gallows .pt.on{opacity:1}
.gallows .face{opacity:0;transition:opacity .3s}
.gallows.dead .face{opacity:1}
.gallows.dead .man{stroke:var(--bad)}
.gallows.saved .man{stroke:var(--good)}
.lives{position:absolute;top:8px;right:12px;font-weight:900;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.lives b{color:var(--gold)}
/* the word */
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;padding:6px 0;--ls:clamp(20px,7vw,40px)}
.word .wd{display:flex;gap:clamp(3px,1vw,6px)}
.word .l{width:calc(var(--ls) * .82);height:calc(var(--ls) * 1.2);display:grid;place-items:end center;font-family:var(--mono);font-weight:800;font-size:var(--ls);line-height:1;border-bottom:4px solid var(--muted);padding-bottom:2px}
.word .l.sym{border-bottom-color:transparent}
.word .l.in{animation:pop .3s ease-out;border-bottom-color:var(--gold)}
.word .l.miss{color:var(--bad);border-bottom-color:var(--bad)}
.word.long{--ls:clamp(16px,4.6vw,30px)}
.word.xlong{--ls:clamp(13px,3.6vw,24px)}
@keyframes pop{0%{transform:translateY(-6px) scale(1.3)}100%{transform:none}}
.clue{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.clue .tx{font-weight:700;color:var(--ink);background:rgba(255,210,63,.16);border:1px solid rgba(255,210,63,.55);border-radius:999px;padding:6px 14px}
/* keyboard */
.kb{display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;max-width:52px;min-width:0;height:clamp(44px,12vw,56px);border:0;border-radius:10px;background:var(--tile);color:var(--ink);font-family:var(--mono);font-weight:800;font-size:clamp(16px,4.6vw,22px);cursor:pointer;touch-action:manipulation;box-shadow:0 3px 0 rgba(0,0,0,.35);padding:0}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.key.ok{background:var(--good);color:#06301c}
.key.no{background:transparent;color:var(--muted);opacity:.45;box-shadow:none;text-decoration:line-through}
.key:disabled{cursor:default}
.bubble{background:var(--panel);border-left:4px solid var(--red);border-radius:12px;padding:12px 14px;line-height:1.45;min-height:3.2em}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--tile);border:2px solid var(--line)}
.dots i.done{background:var(--good);border-color:var(--good)}
.dots i.now{border-color:var(--gold)}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tot div{background:var(--bg);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.tot b{font-family:var(--display);font-size:clamp(22px,6vw,30px);color:var(--gold);font-variant-numeric:tabular-nums}
.tot span{font-size:12px;color:var(--muted)}
.gtable{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;font-size:14px;font-variant-numeric:tabular-nums;align-items:baseline}
.gtable span:not(:nth-child(4n+1)){text-align:right}
.gtable .h{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold)}
.medal{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:12px}
.medal .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.medal .big{font-family:var(--display);font-weight:800;font-size:clamp(22px,6vw,32px);color:var(--gold);line-height:1.15}
.wrow{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wrow:last-child{border-bottom:0}
.wrow.me{color:var(--gold);font-weight:900}
.wrow .n{min-width:0;overflow-wrap:anywhere}
.update{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--gold);color:#3a2600;font-weight:800;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.update button{font:inherit;font-weight:900;border:0;border-radius:999px;padding:10px 18px;background:#3a2600;color:var(--gold);cursor:pointer}
.ver{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 10px}
.verpill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 13px/1.2 var(--body);font-variant-numeric:tabular-nums;cursor:default}
.verpill.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.verpill.new{background:var(--gold);border-color:var(--gold);color:#3a2600;cursor:pointer}
.verdate{font-size:12px;color:var(--muted);opacity:.8}
/* while playing, hide what is not needed */
body.ingame #player,body.ingame #ranking,body.ingame #stats,body.ingame #ver,body.ingame header .note,body.ingame header .sub{display:none}
body.ingame header h1{font-size:clamp(20px,5vw,30px)}
body.ingame .wrap{gap:10px;padding-block:10px 24px}
.play{display:flex;flex-direction:column;gap:12px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:360px){
  body{font-size:16px}
  .theme{padding:11px}.theme b{font-size:16px}.theme .ico{font-size:26px}
  .btn{padding:10px 16px}
  .kr{gap:3px}
}
@media (min-width:600px){
  .wrap{max-width:860px}
  .themes{grid-template-columns:repeat(3,1fr);gap:12px}
  .theme b{font-size:19px}
  .bubble{font-size:16px}
}
/* landscape tablets, landscape phones and computers: drawing and word on the left, keyboard on the right */
@media (min-width:700px) and (orientation:landscape), (min-width:1000px){
  .play{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,44%);gap:20px;align-items:start}
  .gallows{max-height:46vh}
}
@media (max-height:500px) and (orientation:landscape){
  body.ingame header{display:none}
  body.ingame .topbar{padding-block:2px}
  .gallows{max-height:40vh}
  .key{height:40px}
  .themes{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:1000px){
  .wrap{max-width:1180px}
  .play{grid-template-columns:minmax(0,1fr) 460px;gap:28px}
  .themes{grid-template-columns:repeat(3,1fr)}
  .bubble{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<script>
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
/* base letter: capitals, no accents, but keeping Ñ */
function base(s){return String(s).toUpperCase().replace(/Ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"Ñ")}
function gw(s){return base(s).replace(/[^A-ZÑ]/g,"")}

/* ---------- words from around the world: "Word|clue" ---------- */
const THEMES={
  paises:{n:"Países",ic:"🌍",d:"Países de los cinco continentes",w:[

  THEMES.todo={n:"Todo el mundo",ic:"🌐",d:"Mezcla de todos los temas: "+all.length+" palabras",w:all,wide:true}})();

/* ---------- player (this device, and online with a code) ---------- */
const LS="ahorcado-mundo-v1";
function norm(p){p=p||{};return{name:String(p.name||"").slice(0,16),code:typeof p.code==="string"&&/^AH-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(p.code)?p.code:undefined,
  points:Math.max(0,Math.round(+p.points||0)),levels:(p.levels&&typeof p.levels==="object")?p.levels:{},found:Math.max(0,+p.found||0),renames:Math.max(0,Math.min(99,+p.renames||0)),updated:+p.updated||0,
  themes:(p.themes&&typeof p.themes==="object")?p.themes:{},medals:Array.isArray(p.medals)?p.medals.filter(m=>typeof m==="string").slice(0,200):[]}}
let P=null;try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j&&j.name)P=norm(j)}catch(e){}
function saveLocal(){try{if(P)localStorage.setItem(LS,JSON.stringify(P));else localStorage.removeItem(LS)}catch(e){}}

const C=window.SUPABASE_CONFIG;const ONLINE=!!(C&&C.url&&C.key);
function rpc(fn,args){if(!ONLINE)return Promise.reject(new Error("sin conexión online"));
  const h={"Content-Type":"application/json",apikey:C.key};if(/^eyJ/.test(C.key))h.Authorization="Bearer "+C.key;
  return fetch(C.url.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args||{})})
    .then(async r=>{const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error((j&&j.message)||("HTTP "+r.status));return j})}
let saveT=null;
function saveOnline(){if(!P||!P.code)return;clearTimeout(saveT);const me=P;saveT=setTimeout(()=>{
  rpc("ah_save",{p_code:me.code,p_name:me.name,p_points:me.points,p_medals:me.medals.length,p_data:{levels:me.levels,found:me.found,themes:me.themes,medals:me.medals}}).then(ok=>{
    if(ok===false&&P===me){P.code=undefined;saveLocal();setMsg("Tu código ha cambiado en otro dispositivo o ya no existe. Recupéralo con «¿Ya tienes un código?».")}loadTop()}).catch(()=>{})},800)}
function save(){P.updated=Date.now();saveLocal();saveOnline()}
let msg="";function setMsg(t){msg=t;renderPlayer()}
const normCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^AH/,"").replace(/^(.{4})(.{4}).*$/,"AH-$1-$2");

function haveCodeUI(){return `<details><summary>¿Ya tienes un código?</summary><div class="nrow"><input id="cIn" maxlength="14" placeholder="AH-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn" id="cLoad" type="button">Recuperar</button></div></details>`}
function renderPlayer(){
  const el=$("player");let h="";
  if(!P){
    h=`<b>¿Cómo te llamas?</b><div class="nrow"><input id="pName" maxlength="16" placeholder="Tu nombre de jugador" autocomplete="off"><button class="btn" id="pGo" type="button">¡A jugar!</button></div>`+(ONLINE?haveCodeUI():"")+`<button class="linkbtn" id="bkLoad" type="button">📂 Cargar una copia de seguridad</button>`;
  }else{
    h=`<div class="row" style="justify-content:space-between"><span>Juega <b id="pN"></b> · <b style="color:var(--gold)">${P.points.toLocaleString("es-ES")}</b> puntos · <b style="color:var(--gold)">${P.medals.length}</b> ${P.medals.length===1?"medalla":"medallas"}</span></div>`;
    if(P.code)h+=`<div class="row"><span class="note">Tu código:</span><span class="code" id="pCode"></span><button class="btn ghost" id="cCopy" type="button">Copiar</button></div><p class="note">Apúntalo: con él recuperas tus puntos en cualquier móvil u ordenador.</p>`;
    else if(ONLINE)h+=`<div class="row"><button class="btn red" id="cCreate" type="button">🌍 Guardar online y salir en la clasificación</button></div>`+haveCodeUI();
    const left=MAX_RENAMES-P.renames;
    h+=`<details id="opts"><summary>⚙️ Opciones del jugador</summary><div class="opts" id="optBox">`+
      (left>0?`<button class="linkbtn" id="oRen" type="button">✏️ Cambiar nombre (${left===1?"te queda 1 cambio":"te quedan "+left+" cambios"})</button>`:`<span class="note">🔒 Nombre definitivo: ya se ha cambiado ${MAX_RENAMES} veces.</span>`)+
      (P.code?`<button class="linkbtn" id="oRegen" type="button">🔄 Generar un código nuevo</button>`:"")+
      `<button class="linkbtn" id="bkSave" type="button">💾 Guardar copia de seguridad</button>`+
      `<button class="linkbtn" id="bkLoad" type="button">📂 Cargar una copia de seguridad</button>`+
      `<button class="linkbtn" id="oSwitch" type="button">👥 Jugar con otro nombre en este dispositivo</button>`+
      `<button class="linkbtn" id="oDel" type="button" style="color:var(--bad)">🗑️ Borrar este jugador</button></div></details>`;
  }
  if(msg)h+=`<p class="note msg" id="pMsg" role="status"></p>`;
  el.innerHTML=h;if(msg)$("pMsg").textContent=msg;
  if($("pN"))$("pN").textContent=P.name;if($("pCode"))$("pCode").textContent=P.code;
  if($("pGo")){const go=()=>{const n=$("pName").value.trim().slice(0,16);if(!n){setMsg("Escribe tu nombre primero.");return}P=norm({name:n,updated:Date.now()});saveLocal();msg="";renderPlayer();renderThemes();renderStats()};$("pGo").onclick=go;$("pName").addEventListener("keydown",e=>{if(e.key==="Enter")go()})}
  if($("cCopy"))$("cCopy").onclick=()=>{try{navigator.clipboard.writeText(P.code).then(()=>{$("cCopy").textContent="¡Copiado!"},()=>{})}catch(e){}};
  if($("cCreate"))$("cCreate").onclick=async()=>{$("cCreate").disabled=true;try{const r=await rpc("ah_create",{p_name:P.name});P.code=r.code;save();msg="¡Código creado! Apúntalo bien: con él recuperas tus puntos en cualquier dispositivo.";renderPlayer();loadTop()}catch(e){$("cCreate").disabled=false;setMsg("No se ha podido crear el código. Revisa la conexión.")}};
  if($("cLoad")){const load=async()=>{const code=normCode($("cIn").value);if(!/^AH-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)){setMsg("Escribe el código completo, por ejemplo AH-7K3Q-9XPA.");return}
      try{const r=await rpc("ah_load",{p_code:code});if(!r){setMsg("No existe ningún jugador con ese código.");return}
        const d=r.data||{};P=norm({name:r.name,code,points:r.points,levels:d.levels,found:d.found,themes:d.themes,medals:d.medals,renames:r.renames,updated:Date.now()});saveLocal();msg="¡Recuperado! Hola, "+r.name+".";renderPlayer();renderThemes();renderStats();loadTop()}
      catch(e){setMsg("No se ha podido recuperar. Revisa la conexión.")}};
    $("cLoad").onclick=load;$("cIn").addEventListener("keydown",e=>{if(e.key==="Enter")load()})}
  if($("bkSave"))$("bkSave").onclick=backupSave;
  if($("bkLoad"))$("bkLoad").onclick=()=>$("bkFile").click();
  if($("oRen"))$("oRen").onclick=renameUI;
  if($("oRegen"))$("oRegen").onclick=regenUI;
  if($("oSwitch"))$("oSwitch").onclick=()=>{askBox(`Vas a jugar con otro nombre. ${P.code?"Apunta antes tu código ("+esc(P.code)+") para poder recuperar a "+esc(P.name)+" después.":"Los puntos de "+esc(P.name)+" no tienen código y se perderán en este dispositivo."}`,"Sí, cambiar",()=>{msg="";P=null;saveLocal();showThemes();renderPlayer()})};
  if($("oDel"))$("oDel").onclick=()=>{askBox(`¿Seguro que quieres borrar a <b>${esc(P.name)}</b>? Se perderán sus puntos y niveles${P.code?", y saldrá de la clasificación":""}. No se puede deshacer.`,"Sí, borrar",async()=>{
      if(P.code){try{await rpc("ah_delete",{p_code:P.code})}catch(e){setMsg("No se ha podido borrar online. Revisa la conexión.");return}}
      msg="Jugador borrado.";P=null;saveLocal();showThemes();renderPlayer();loadTop()},true)};
}
function askBox(html,okText,fn,danger){const b=$("optBox");if(!b)return;
  b.innerHTML=`<p class="note" style="color:var(--ink)">${html}</p><div class="row"><button class="btn ${danger?"red":""}" id="aOk" type="button">${okText}</button><button class="btn ghost" id="aNo" type="button">Cancelar</button></div>`;
  $("aNo").onclick=()=>renderPlayer();$("aOk").onclick=()=>{$("aOk").disabled=true;fn()}}
function renameUI(){const b=$("optBox");if(!b||P.renames>=MAX_RENAMES)return;const left=MAX_RENAMES-P.renames;
  b.innerHTML=`<label class="note" for="rIn">Nuevo nombre (máximo 16 letras). ${left===1?"Es tu último cambio.":"Solo puedes cambiarlo "+MAX_RENAMES+" veces en total."}</label><div class="nrow" style="width:100%"><input id="rIn" maxlength="16" autocomplete="off"><button class="btn" id="rOk" type="button">Guardar</button></div><button class="linkbtn" id="rNo" type="button">Cancelar</button>`;
  const i=$("rIn");i.value=P.name;i.focus();
  const ok=()=>{const n=i.value.trim().slice(0,16);if(!n||n===P.name){renderPlayer();return}P.name=n;P.renames++;save();msg=`¡Listo! Ahora te llamas ${n}.`;renderPlayer()};
  $("rOk").onclick=ok;i.addEventListener("keydown",e=>{if(e.key==="Enter")ok()});$("rNo").onclick=()=>renderPlayer()}
function regenUI(){askBox("Se creará un código nuevo y <b>el anterior dejará de funcionar</b>. Tus puntos y tu puesto se mantienen. En tus otros dispositivos tendrás que poner el código nuevo.","Sí, código nuevo",async()=>{
  try{const r=await rpc("ah_regen",{p_code:P.code});if(!r||!r.code){setMsg("Ese código ya no existe en el servidor.");return}P.code=r.code;save();msg="¡Código nuevo creado! Apúntalo bien.";renderPlayer()}
  catch(e){setMsg("No se ha podido crear el código nuevo. Revisa la conexión.")}})}

/* ---------- backup file (save / load progress) ---------- */
const BK_APP="ahorcado-vuelta-al-mundo";
function backupSave(){if(!P)return;const d=new Date(),z=n=>String(n).padStart(2,"0");
  const fname=`ahorcado-progreso-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}.json`;
  const json=JSON.stringify({app:BK_APP,version:APP_VERSION,saved:d.toISOString(),player:P},null,2);
  try{const url=URL.createObjectURL(new Blob([json],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
    setMsg(`Copia guardada en Descargas: ${fname}. Guárdala bien${P.code?": incluye tu código de jugador":""}.`)}
  catch(e){setMsg("No se ha podido descargar la copia en este dispositivo.")}}
function backupApply(inc){
  P=inc;saveLocal();msg=`¡Progreso recuperado! Hola, ${inc.name}: tienes ${inc.points.toLocaleString("es-ES")} puntos y ${inc.medals.length} ${inc.medals.length===1?"medalla":"medallas"}.`;showThemes();renderPlayer();renderThemes();renderStats();
  if(P.code)rpc("ah_load",{p_code:P.code}).then(r=>{if(P!==inc)return;
    if(!r){P.code=undefined;saveLocal();setMsg("Progreso recuperado, pero el código de la copia ya no existe online. Pulsa «Guardar online» para crear uno nuevo.");return}
    const d=r.data||{};if((+r.points||0)>P.points){P=norm({name:r.name,code:P.code,points:r.points,levels:d.levels,found:d.found,themes:d.themes,medals:d.medals,renames:r.renames,updated:Date.now()});saveLocal();setMsg(`¡Progreso recuperado! Online tenías más puntos, así que se han usado esos: ${P.points.toLocaleString("es-ES")}.`);renderThemes();renderStats()}
    else save();loadTop()}).catch(()=>{});}
$("bkFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  const r=new FileReader();
  r.onload=()=>{let inc;try{const j=JSON.parse(r.result);if(!j||j.app!==BK_APP||!j.player||!j.player.name)throw 0;inc=norm(j.player);inc.updated=Date.now()}
    catch(err){setMsg("Ese archivo no es una copia de este ahorcado. Elige el archivo que empieza por ahorcado-progreso.");return}
    if(P&&$("optBox")){$("opts").open=true;askBox(`Se cambiará <b>${esc(P.name)}</b> (${P.points.toLocaleString("es-ES")} puntos) por <b>${esc(inc.name)}</b> (${inc.points.toLocaleString("es-ES")} puntos), que es lo que hay en la copia.${P.code&&P.code!==inc.code?" Apunta antes tu código actual ("+esc(P.code)+").":""}`,"Sí, cargar la copia",()=>backupApply(inc))}
    else backupApply(inc)};
  r.onerror=()=>setMsg("No se ha podido leer el archivo.");r.readAsText(f)});

/* ---------- ranking ---------- */
let topList=[];
function loadTop(){if(!ONLINE){$("top").innerHTML='<p class="note">La clasificación online no está activada.</p>';return}
  rpc("ah_top",{p_limit:20}).then(r=>{topList=Array.isArray(r)?r:[];renderTop()}).catch(()=>{$("top").innerHTML='<p class="note">No se ha podido cargar la clasificación.</p>'})}
function renderTop(){const m=["🥇","🥈","🥉"];
  $("top").innerHTML=topList.length?topList.map((d,i)=>`<div class="wrow${P&&P.code&&d.name===P.name&&d.points===P.points?" me":""}"><span>${m[i]||(i+1)+"º"}</span><span class="n">${esc(d.name)}</span><span>${Number(d.points).toLocaleString("es-ES")} pts · 🏅 ${Number(d.medals||0)}</span></div>`).join(""):'<p class="note">Todavía no hay nadie. Pulsa «Guardar online» y sé la primera persona.</p>'}

/* ---------- points and medals ---------- */
function tstat(k){if(!P.themes[k]||typeof P.themes[k]!=="object")P.themes[k]={pts:0,best:0,plays:0};return P.themes[k]}
function addPts(n){if(!n||!P)return;P.points+=n;tstat(theme).pts+=n;S.earned+=n}
function giveMedal(m){if(!P||P.medals.includes(m))return false;P.medals.push(m);return true}
function renderStats(){const el=$("statsBox");if(!el)return;
  if(!P){el.innerHTML='<p class="note">Escribe tu nombre arriba para empezar a sumar puntos y medallas.</p>';return}
  const rows=ORDER.map(k=>{const s=P.themes[k]||{};return `<span>${THEMES[k].ic} ${esc(THEMES[k].n)}</span><span>${(s.pts||0).toLocaleString("es-ES")}</span><span>${(s.best||0).toLocaleString("es-ES")}</span><span>${lvUnlocked(k)}</span>`}).join("");
  el.innerHTML=`<div class="tot"><div><b>${P.points.toLocaleString("es-ES")}</b><span>puntos totales</span></div><div><b>${P.medals.length}</b><span>${P.medals.length===1?"medalla":"medallas"}</span></div><div><b>${P.found.toLocaleString("es-ES")}</b><span>palabras acertadas</span></div></div>
    <div class="gtable"><span class="h">Tema</span><span class="h">Puntos</span><span class="h">Récord</span><span class="h">Nivel</span>${rows}</div>
    <p class="note">El récord es lo máximo que has ganado en un solo nivel.</p>`+
    (P.medals.length?`<div class="chips">${P.medals.map(m=>`<span>🏅 ${esc(m)}</span>`).join("")}</div>`:`<p class="note">Aún sin medallas. ¡Supera un nivel para ganar la primera!</p>`)}

/* ---------- sound ---------- */
let ac=null;function A(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume();return ac}
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
const SFX={ok(){if(!A())return;const t=ac.currentTime;[659,784].forEach((f,k)=>tone(f,t+k*.07,.12,"square",.05))},bad(){if(!A())return;tone(200,ac.currentTime,.25,"sawtooth",.05)},tick(){if(!A())return;tone(880,ac.currentTime,.05,"triangle",.07)},
  word(){if(!A())return;const t=ac.currentTime;[523,659,784,1047].forEach((f,k)=>tone(f,t+k*.07,.14,"square",.06))},
  win(){if(!A())return;const t=ac.currentTime;[523,659,784,1047,1319].forEach((f,k)=>tone(f,t+k*.1,.25,"triangle",.08))},
  lose(){if(!A())return;const t=ac.currentTime;[392,330,262,196].forEach((f,k)=>tone(f,t+k*.16,.3,"sawtooth",.05))}};

/* ---------- themes & levels ---------- */
let theme=null;const pick={};
function lvUnlocked(th){return Math.min(LVMAX,Math.max(1,(P&&P.levels[th])||1))}
function renderThemes(){$("themes").innerHTML=ORDER.map(k=>{const t=THEMES[k];return `<button class="theme${t.wide?" wide":""}" id="th-${k}" type="button" data-th="${k}"><span class="ico">${t.ic}</span><b>${t.n}</b><span>${t.d}</span><span class="lvtag">Nivel ${lvUnlocked(k)} de ${LVMAX}</span></button>`}).join("")}
$("themes").addEventListener("click",e=>{const b=e.target.closest("[data-th]");if(!b)return;if(!P){setMsg("Primero escribe tu nombre aquí arriba.");$("pName")&&$("pName").focus();window.scrollTo({top:0,behavior:"smooth"});return}A();theme=b.dataset.th;startLevel()});
function showThemes(){$("vGame").hidden=true;$("vThemes").hidden=false;document.body.classList.remove("ingame");renderThemes();renderStats();renderPlayer();try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}ping()}
$("back").onclick=()=>{try{if(location.hash==="#jugando"){history.back();setTimeout(()=>{if(!$("vGame").hidden)showThemes()},400);return}}catch(e){}showThemes()};
window.addEventListener("popstate",()=>{if(!$("vGame").hidden)showThemes()});
/* difficulty by level: fewer mistakes allowed, longer words, more words per level, the clue costs points, fewer letters given */
function cfg(lv){
  const lives=Math.max(6,10-Math.floor((lv-1)/8));
  const words=lv<=12?3:lv<=25?4:lv<=40?5:6;
  const clue=lv<=12?"free":lv<=28?"ask":"cost";
  const hints=lv<=6?3:lv<=16?2:lv<=30?1:0;
  const txt=`Puedes fallar ${lives} veces por palabra. `+(clue==="free"?"La pista se ve desde el principio.":clue==="ask"?"La pista está tapada: verla no cuesta puntos, pero si no la miras ganas 5 más.":"La pista está tapada y verla resta 10 puntos de la palabra.")+(hints?` Tienes ${hints} ${hints===1?"letra regalada":"letras regaladas"} por nivel.`:" Ya no hay letras regaladas.");
  return{lives,words,clue,hints,txt}}
function renderLv(){const u=lvUnlocked(theme),lv=S.level,el=$("lv");
  el.innerHTML=`<button class="btn ghost" id="lvPrev" type="button" aria-label="Nivel anterior"${lv<=1?" disabled":""}>◀</button><span class="lvlabel">Nivel <b>${lv}</b> <small class="note">de ${LVMAX}</small></span><button class="btn ghost" id="lvNext" type="button" aria-label="Nivel siguiente"${lv>=u?" disabled":""}>${lv>=u&&u<LVMAX?"🔒":"▶"}</button>${u>lv+1?`<button class="btn ghost" id="lvMax" type="button">Ir al ${u} ⏩</button>`:""}`;
  $("lvPrev").onclick=()=>{pick[theme]=lv-1;startLevel()};$("lvNext").onclick=()=>{pick[theme]=lv+1;startLevel()};if($("lvMax"))$("lvMax").onclick=()=>{pick[theme]=u;startLevel()}}

/* fit to very big screens */
let UIZ=1;
function fitZoom(){let z=1;try{const w=innerWidth;if(w>=1700&&matchMedia("(pointer:fine)").matches)z=Math.min(2.6,w/1450)}catch(e){}
  UIZ=z;const el=document.querySelector(".wrap");if(el)el.style.zoom=z===1?"":z.toFixed(3)}
let fitT=null;window.addEventListener("resize",()=>{clearTimeout(fitT);fitT=setTimeout(fitZoom,80)});
fitZoom();

/* ---------- the hangman ---------- */
const ROWS=["QWERTYUIOP","ASDFGHJKLÑ","ZXCVBNM"];
const S={level:1,c:null,list:[],idx:0,cur:null,guessed:new Set(),miss:0,hints:0,clueSeen:false,state:"play",earned:0,recent:{}};
function chooseWords(lv,n){
  /* words sorted by length: low levels take from the short end, high levels from the long end */
  const all=THEMES[theme].w,L=all.length,f=(lv-1)/(LVMAX-1),win=Math.max(n+2,Math.round(L*.4));
  let start=Math.round(f*(L-win));start=Math.max(0,Math.min(L-win,start));
  const recent=S.recent[theme]||[];
  let pool=all.slice(start,start+win).filter(o=>!recent.includes(o.w));if(pool.length<n)pool=all.slice(start,start+win);
  const out=shuffle(pool).slice(0,n);S.recent[theme]=[...recent,...out.map(o=>o.w)].slice(-Math.floor(L/2));return out}
function startLevel(){
  const u=lvUnlocked(theme),lv=pick[theme]&&pick[theme]<=u?pick[theme]:u;S.level=lv;S.c=cfg(lv);S.hints=S.c.hints;S.earned=0;S.lvMiss=0;$("medal").hidden=true;
  S.list=chooseWords(lv,S.c.words);S.idx=0;
  $("vThemes").hidden=true;$("vGame").hidden=false;$("gTitle").textContent=THEMES[theme].ic+" "+THEMES[theme].n;
  $("rules").textContent=S.c.txt+" Pulsa las letras o escríbelas con el teclado.";
  try{if(location.hash!=="#jugando")history.pushState(null,"","#jugando")}catch(e){}
  document.body.classList.add("ingame");renderLv();startWord();window.scrollTo({top:0});ping();
  $("bubble").textContent=`Nivel ${lv}: adivina ${S.list.length} palabras. Cada una vale ${wordPts()} puntos, más un extra por los fallos que te sobren. ¡Suerte!`;
}
function startWord(){S.cur=S.list[S.idx];S.guessed=new Set();S.miss=0;S.clueSeen=S.c.clue==="free";S.state="play";$("again").hidden=true;$("gal").classList.remove("dead","saved");
  /* very short words in "todo": nothing special. Letters not in A–Z/Ñ are shown from the start. */
  buildKb();render();if(S.idx>0)$("bubble").textContent=`Palabra ${S.idx+1} de ${S.list.length}. ¡Vamos!`}
function wordPts(){return 10+2*S.level}
function revealedAll(){return [...S.cur.w].every(ch=>S.guessed.has(ch))}
function render(){
  const o=S.cur,over=S.state!=="play";
  /* word, with accents shown once the letter is found */
  const parts=o.label.split(" ");const len=o.label.length;
  const W=$("word");W.className="word"+(len>16?" xlong":len>10?" long":"");
  W.innerHTML=parts.map(p=>`<span class="wd">${[...p].map(ch=>{const b=base(ch);
      if(!/[A-ZÑ]/.test(b))return `<span class="l sym">${esc(ch)}</span>`;
      const got=S.guessed.has(b);if(got)return `<span class="l in" data-b="${b}">${esc(ch)}</span>`;
      if(S.state==="lost")return `<span class="l miss">${esc(ch)}</span>`;return `<span class="l"></span>`}).join("")}</span>`).join("");
  W.setAttribute("aria-label","Palabra: "+[...o.label].map(ch=>{const b=base(ch);return /[A-ZÑ]/.test(b)?(S.guessed.has(b)||over?ch:"hueco"):ch===" "?"espacio":ch}).join(" "));
  /* clue */
  const cl=$("clue");
  if(S.clueSeen||over)cl.innerHTML=`<span class="tx">🧭 ${esc(o.clue)}</span>`+(theme==="todo"?`<span class="note">(${esc(o.from)})</span>`:"");
  else cl.innerHTML=`<button class="btn ghost" id="seeClue" type="button">🧭 Ver pista${S.c.clue==="cost"?" (−10 puntos)":""}</button>`;
  if($("seeClue"))$("seeClue").onclick=()=>{S.clueSeen=true;SFX.tick();render()};
  /* drawing: the gallows already built at hard levels, plus one part per mistake */
  const pre=PARTS-S.c.lives,drawn=pre+S.miss;
  for(let k=0;k<PARTS;k++)$("p"+k).classList.toggle("on",k<drawn||S.state==="lost");
  $("lives").innerHTML=`Fallos: <b>${S.miss}</b> / ${S.c.lives}`;
  /* keys */
  document.querySelectorAll("#kb .key").forEach(k=>{const ch=k.dataset.k,used=S.guessed.has(ch),hit=used&&S.cur.w.includes(ch);
    k.classList.toggle("ok",hit);k.classList.toggle("no",used&&!hit);k.disabled=used||over;k.setAttribute("aria-label",ch+(hit?", acertada":used?", fallada":""))});
  /* top strip, dots, hint */
  $("count").textContent=`Palabra ${S.idx+1} de ${S.list.length}`;$("pts").textContent=(P?P.points:0).toLocaleString("es-ES");
  $("dots").innerHTML=S.list.map((_,k)=>`<i class="${k<S.idx||(k===S.idx&&S.state==="won")?"done":k===S.idx?"now":""}"></i>`).join("");
  const h=$("hint");h.textContent=S.hints>0?`💡 Letra (${S.hints})`:"💡 Sin letras";h.disabled=S.hints<=0||over;
}
function buildKb(){$("kb").innerHTML=ROWS.map(r=>`<div class="kr">${[...r].map(ch=>`<button class="key" type="button" data-k="${ch}">${ch}</button>`).join("")}</div>`).join("")}
$("kb").addEventListener("click",e=>{const k=e.target.closest(".key");if(!k||k.disabled)return;A();guess(k.dataset.k)});
function guess(ch){
  if(S.state!=="play"||S.guessed.has(ch))return;S.guessed.add(ch);
  if(S.cur.w.includes(ch)){
    const n=[...S.cur.w].filter(x=>x===ch).length;
    if(revealedAll()){wordWon();return}
    SFX.ok();render();$("bubble").textContent=n>1?`¡Bien! La ${ch} sale ${n} veces.`:`¡Bien! Hay una ${ch}.`;
  }else{
    S.miss++;S.lvMiss++;SFX.bad();
    if(S.miss>=S.c.lives){wordLost();return}
    const left=S.c.lives-S.miss;render();$("bubble").textContent=`No hay ninguna ${ch}. ${left===1?"¡Cuidado, solo te queda un fallo!":"Te quedan "+left+" fallos."}`;
  }
}
function wordWon(){
  S.state="won";const extra=3*(S.c.lives-S.miss),clueAdj=S.c.clue==="ask"&&!S.clueSeen?5:S.c.clue==="cost"&&S.clueSeen?-10:0;
  const got=Math.max(5,wordPts()+extra+clueAdj);addPts(got);P.found++;const wm=WORD_MEDALS.find(n=>P.found===n);if(wm)giveMedal(`${wm} palabras acertadas`);save();
  $("gal").classList.add("saved");render();
  const last=S.idx>=S.list.length-1;
  $("bubble").textContent=`${rnd(PRAISE)} Era ${S.cur.label}. +${got} puntos`+(extra?` (incluye ${extra} por los fallos que te sobraron`+(clueAdj>0?" y 5 por no mirar la pista":clueAdj<0?", menos 10 por la pista":"")+")":clueAdj<0?" (menos 10 por la pista)":clueAdj>0?" (incluye 5 por no mirar la pista)":"")+".";
  if(last){setTimeout(levelWon,700);SFX.word();return}
  SFX.word();$("again").hidden=false;$("again").textContent="Siguiente palabra →";$("again").onclick=()=>{S.idx++;startWord()};$("again").focus({preventScroll:true});
}
function wordLost(){
  S.state="lost";$("gal").classList.add("dead");tstat(theme).plays++;save();SFX.lose();render();
  $("bubble").textContent=`¡Ahorcado! La palabra era ${S.cur.label}. Los puntos que has ganado se quedan, pero tienes que repetir el nivel ${S.level} con palabras nuevas.`;
  $("again").hidden=false;$("again").textContent="Repetir el nivel";$("again").onclick=()=>{pick[theme]=S.level;startLevel()};$("again").focus({preventScroll:true});
}
function levelWon(){
  const lv=S.level,next=Math.min(LVMAX,lv+1),bonus=20+lv*5,tn=THEMES[theme].n;pick[theme]=null;addPts(bonus);
  const st=tstat(theme);st.plays++;const rec=S.earned>(st.best||0);if(rec)st.best=S.earned;
  /* medal for how well the level went, plus milestones */
  const title=S.lvMiss===0?"Ojo de halcón":S.lvMiss<=S.list.length?"Gran viajero":"Mochilero";
  const won=[];if(giveMedal(`${tn} · ${title}`))won.push(`${tn} · ${title}`);
  if((P.levels[theme]||1)<next)P.levels[theme]=next;
  const miles=[10,25].filter(m=>next>=m).map(m=>`${tn} · nivel ${m}`);if(lv===LVMAX)miles.push(`${tn} · nivel máximo`);
  for(const m of miles)if(giveMedal(m))won.push(m);
  save();SFX.win();render();
  const md=$("medal");md.hidden=false;md.innerHTML=`<span class="eyebrow">Tu medalla</span><span class="big">🏅 ${esc(title)}</span><span class="note">${S.lvMiss===0?"¡Nivel sin ningún fallo!":S.lvMiss+(S.lvMiss===1?" fallo en todo el nivel":" fallos en todo el nivel")} · ${S.earned} puntos${rec?" · ¡nuevo récord!":""}</span>`+(won.length?`<span class="note" style="color:var(--gold)">Medallas nuevas: ${won.map(esc).join(", ")}</span>`:"");
  $("bubble").textContent=lv<LVMAX?`¡Nivel ${lv} superado! Ganas ${bonus} puntos extra (${S.earned} en este nivel) y desbloqueas el nivel ${next}, que será un poco más difícil.`:`¡Increíble! Has superado el nivel más difícil de este tema. +${bonus} puntos.`;
  $("again").hidden=false;$("again").textContent=lv<LVMAX?`Jugar el nivel ${next}`:"Jugar otra vez";$("again").onclick=startLevel;$("again").focus({preventScroll:true});renderLv();
}
$("hint").onclick=()=>{if(S.hints<=0||S.state!=="play")return;
  /* give the missing letter that appears most often */
  const miss=[...new Set(S.cur.w)].filter(ch=>!S.guessed.has(ch));if(!miss.length)return;
  miss.sort((a,b)=>[...S.cur.w].filter(x=>x===b).length-[...S.cur.w].filter(x=>x===a).length);
  S.hints--;SFX.tick();const ch=miss[0];S.guessed.add(ch);if(revealedAll()){wordWon();return}render();$("bubble").textContent=`Te regalo la ${ch}.`};
document.addEventListener("keydown",e=>{
  if($("vGame").hidden||e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
  if(e.key==="Enter"&&!$("again").hidden&&document.activeElement!==$("again")){e.preventDefault();$("again").click();return}
  if(e.key.length!==1)return;const ch=base(e.key);if(!/^[A-ZÑ]$/.test(ch))return;e.preventDefault();A();guess(ch)});

/* ---------- owner's "who is playing" ping (nothing is shown to players) ---------- */
let sid=null;try{sid=sessionStorage.getItem("ah-sid")}catch(e){}
if(!sid){sid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{sessionStorage.setItem("ah-sid",sid)}catch(e){}}
function ping(){if(document.hidden||!ONLINE)return;const place=$("vGame").hidden?"Eligiendo tema":THEMES[theme].n+" · nivel "+S.level;
  rpc("ah_ping",{p_session:sid,p_name:P?P.name:null,p_place:place.slice(0,40),p_code:!!(P&&P.code)}).catch(()=>{})}
setTimeout(ping,3000);setInterval(ping,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)ping()});

/* ---------- new version notice ---------- */
const APP_VERSION="1.3.1",APP_DATE="5 de noviembre de 2026 a las 02:29";
/* version shown at the bottom: green when it is the latest one, yellow (tap to update) when there is a newer one */
function verPill(state,rel){const b=$("verPill");b.className="verpill"+(state?" "+state:"");b.disabled=state!=="new";
  b.textContent=state==="ok"?`✅ Versión ${APP_VERSION} · actualizada`:state==="new"?`✨ Hay una versión nueva (${rel}) · Actualizar`:`Versión ${APP_VERSION}`}
(function(){const live=/^https?:$/.test(location.protocol);
  verPill("",null);$("verDate").textContent=live?`Publicada el ${APP_DATE}`:"Versión de prueba";
  if(!live)return;let latest=null,snooze=0;
  const go=()=>location.replace(location.pathname+"?v="+encodeURIComponent(latest||Date.now()));
  function chk(){if(document.hidden)return;fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.version)return;
    if(j.version!==APP_VERSION){latest=j.version;verPill("new",j.version);$("updTxt").textContent=`✨ Hay una versión nueva (${j.version}). Tu progreso no se pierde.`;if(Date.now()>=snooze)$("upd").hidden=false}
    else verPill("ok")}).catch(()=>{})}
  $("verPill").onclick=go;$("updGo").onclick=go;
  $("updLater").onclick=()=>{$("upd").hidden=true;snooze=Date.now()+600000};
  chk();setInterval(chk,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()})})();

/* ---------- start ---------- */
try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}
renderPlayer();renderThemes();renderStats();loadTop();
if(P&&P.code)rpc("ah_load",{p_code:P.code}).then(r=>{if(!r)return;if(r.name!==P.name||r.renames!==P.renames){P.name=r.name;P.renames=Math.max(P.renames,r.renames||0);saveLocal();renderPlayer()}}).catch(()=>{});
</script>
